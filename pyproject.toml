[project]
name = "cincoditta"
version = "0.1.0"
description = "Organizzazione del lavoro per una ditta di stampaggio plastica"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/cincoditta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
