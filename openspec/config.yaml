schema: spec-driven

context: |
  Language: Italian
  All artifacts must be written in Italian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Progetto: CincoDitta, software per l'organizzazione del lavoro in una ditta
  di stampaggio plastica.

  Stack (vincolante):
  - Backend: Python >= 3.12, FastAPI, gestione dipendenze con uv.
  - Database: SQLite, tramite il modulo standard sqlite3, un solo file.
  - Frontend: pagine web statiche in HTML, CSS e JavaScript puro, senza fase di
    build. Comunicano con il backend solo tramite API JSON sotto /api.
  - Test: pytest.

  Struttura: backend/cincoditta (codice), frontend (pagine), tests (test),
  data (database locale, escluso da git).

  Flusso confermato dalla ditta: la commessa senza materia prima disponibile o
  con data confermata attende in una coda a parte; se lo stampo è già in macchina
  o in coda si accorpa, purché tutti i lavori coinvolti restino entro la data di
  spedizione; altrimenti si sceglie la coda tra le presse compatibili, e il
  responsabile conferma la proposta. Seguono produzione, montaggio se previsto
  (con lista d'attesa se mancano i componenti, che non bloccano la stampa),
  controllo qualità, magazzino prodotti finiti e spedizione.

  Dati: il gestore mantiene in un file Excel dati tecnici, ordini e flussi di
  magazzino; le giacenze sono calcolate dal programma dai movimenti.

  Non aggiungere funzionalità di dominio senza una modifica OpenSpec dedicata.

  Terminologia: usare i termini italiani del reparto nelle specifiche e
  nell'interfaccia.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
