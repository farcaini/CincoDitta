schema: spec-driven

context: |
  Language: Italian
  All artifacts must be written in Italian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Progetto: CincoDitta, software per l'organizzazione del lavoro in una ditta
  di stampaggio plastica.

  Stack (vincolante):
  - Backend: Python >= 3.12, FastAPI, gestione dipendenze con uv.
  - Database: SQLite, tramite il modulo standard sqlite3, un solo file.
  - Frontend: pagine web statiche in HTML, CSS e JavaScript puro, senza fase di
    build. Comunicano con il backend solo tramite API JSON sotto /api.
  - Test: pytest.

  Struttura: backend/cincoditta (codice), frontend (pagine), tests (test),
  data (database locale, escluso da git).

  Dominio (ipotesi iniziale, da confermare a ogni proposta): commesse e ordini,
  presse a iniezione, stampi, materie prime, turni e operatori, pianificazione
  della produzione. Non aggiungere funzionalità di dominio senza una modifica
  OpenSpec dedicata.

  Terminologia: usare i termini italiani del reparto nelle specifiche e
  nell'interfaccia.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
